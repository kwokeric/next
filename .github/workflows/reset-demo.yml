name: Reset demo data

# Vercel's Hobby plan only allows cron jobs to run once a day, so this runs
# from Actions instead — it's independent of hosting plan and can hit an
# arbitrary cadence. Requires two repo secrets set under Settings > Secrets
# and variables > Actions:
#   APP_URL       the deployed app's origin, e.g. https://next-app.vercel.app
#   RESET_SECRET  same value as the RESET_SECRET env var set on the host

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are set
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "::error::APP_URL secret is not set (Settings > Secrets and variables > Actions). It must be the full deployed origin, e.g. https://next-app.vercel.app — no trailing slash."
            exit 1
          fi
          case "${{ secrets.APP_URL }}" in
            http://*|https://*) ;;
            *)
              echo "::error::APP_URL secret ('${{ secrets.APP_URL }}') doesn't start with http:// or https:// — that's why curl reports a malformed URL (exit code 3)."
              exit 1
              ;;
          esac
          if [ -z "${{ secrets.RESET_SECRET }}" ]; then
            echo "::error::RESET_SECRET secret is not set (Settings > Secrets and variables > Actions). It must match the RESET_SECRET env var configured on the host."
            exit 1
          fi

      - name: Call reset endpoint
        run: |
          curl -sS -f -X POST "${{ secrets.APP_URL }}/api/reset" \
            -H "Authorization: Bearer ${{ secrets.RESET_SECRET }}"
